name: Reusable CI Quality

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: '3.11'
      fail_on_warnings:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  workflow_manifest_lint:
    name: Workflow YAML syntax checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install YAML parser
        run: |
          python -m pip install --quiet pyyaml

      - name: Validate workflow YAML files
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          failed = False
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failed = True
                  print(f"Workflow parse failure in {path}: {exc}", file=sys.stderr)

          if failed:
              sys.exit(1)
          print("All workflow YAML files parsed successfully.")
          PY

  python_sanity:
    name: Python package sanity checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - workflow_manifest_lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python compile checks
        run: |
          python -m compileall -q pipelines research scripts
          python -m unittest discover -s tests -v

      - name: Validate web snapshot guards
        run: |
          python scripts/validate_story_evidence.py
          node --test tests/web_loading.test.mjs tests/web_story.test.mjs

      - name: Install existing Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate loading and recovery states
        run: python scripts/playwright_loading.py --out artifacts/loading

      - name: Validate source-linked story and recovery states
        run: python scripts/playwright_story.py --out artifacts/story

      - name: Upload story validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-validation
          path: artifacts/story
          if-no-files-found: error

      - name: Upload loading validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loading-validation
          path: artifacts/loading
          if-no-files-found: ignore

  artifact_validation:
    name: Artifact validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - python_sanity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reconcile checkout evidence availability
        run: |
          python -m pipelines.ingest --inventory research/source_inventory.yaml --refresh-quality-only

      - name: Validate generated artifacts
        run: |
          python scripts/validate_artifacts.py --inventory research/source_inventory.yaml --catalog data/manifests/catalog.json --manifests data/manifests ${{ inputs.fail_on_warnings && '--fail-on-warning' || '' }}

  quality_gate:
    name: Quality gate status
    runs-on: ubuntu-latest
    needs:
      - workflow_manifest_lint
      - python_sanity
      - artifact_validation
    steps:
      - name: Evaluate quality gate status
        run: |
          echo "Quality gate passed for required jobs."
